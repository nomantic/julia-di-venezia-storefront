services:
  storefront:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VENDURE_SHOP_API_URL: ${VENDURE_SHOP_API_URL:-http://localhost:8080/shop-api}
        NEXT_PUBLIC_VENDURE_SHOP_API_URL: ${NEXT_PUBLIC_VENDURE_SHOP_API_URL:-http://localhost:8080/shop-api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-Julia di venezia}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_live_51UNVfaEnyJt4Xq2R4hFATnB1Hyowz3dmkv5GEhBUNyt6FpAXjpoPvaXDv40zD0ceKee3TbkA8iI7AeE2x1fa3wFb00yDW5AslM}
    image: julia-storefront:latest
    container_name: julia-storefront
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
